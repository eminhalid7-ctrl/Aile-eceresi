<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2724">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var k=localStorage.getItem("secere-skin");if(k)document.documentElement.setAttribute("data-skin",k);if(k==="custom"){var c=JSON.parse(localStorage.getItem("secere-custom")||"{}");for(var n in c)document.documentElement.style.setProperty(n,c[n]);}}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Aile Şeceresi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen pannable canvas (dotted survey paper) with floating chips; bottom sheet for the selected person */
:root{
  --paper:#ECEFE9; --dot:#C9CFC6; --ink:#1E2724; --muted:#5E6B66; --line:#8C9792;
  --card:#FBFCFA; --card-edge:#D3D9D2; --male:#2B6A8A; --female:#A8466A; --unknown:#8A8F7C;
  --gold:#B67D12; --gold-soft:#F3E6C8; --danger:#A33B2E; --sheet:#FFFFFF; --shadow:rgba(30,39,36,.14);
  --band:rgba(30,39,36,.035); --br0:#2F7F73; --br1:#B07A1E; --br2:#7A4E8C; --br3:#B4553A; --br4:#5E7A24; --br5:#3F6390; --br6:#9B4F6B; --br7:#2E7D4F;
  --f-display:"Young Serif",Georgia,serif;
  --f-body:"Figtree","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141A18; --dot:#28302D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#5D6A65;
  --card:#1D2522; --card-edge:#2F3935; --male:#6FB0D2; --female:#E08AAA; --unknown:#A9AE98;
  --gold:#E2AE4A; --gold-soft:#3A3120; --danger:#E27A6C; --sheet:#1A211F; --shadow:rgba(0,0,0,.45); --band:rgba(255,255,255,.035); --br0:#5CC2B2; --br1:#E2AE4A; --br2:#B892CC; --br3:#E5876C; --br4:#A6C462; --br5:#7FA6DA; --br6:#DE8DAB; --br7:#6CC48C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A18; --dot:#28302D; --ink:#E6ECE8; --muted:#9AA7A1; --line:#5D6A65;
  --card:#1D2522; --card-edge:#2F3935; --male:#6FB0D2; --female:#E08AAA; --unknown:#A9AE98;
  --gold:#E2AE4A; --gold-soft:#3A3120; --danger:#E27A6C; --sheet:#1A211F; --shadow:rgba(0,0,0,.45); --band:rgba(255,255,255,.035); --br0:#5CC2B2; --br1:#E2AE4A; --br2:#B892CC; --br3:#E5876C; --br4:#A6C462; --br5:#7FA6DA; --br6:#DE8DAB; --br7:#6CC48C; color-scheme:dark}
/* temalar: sistem teması (varsayılan) + seçilebilir uyumlu paletler */
:root[data-skin="kasgar"]{--paper:#EAF1F3;--dot:#C8D6DB;--ink:#13303A;--muted:#4F6A73;--line:#86A1AA;--card:#FFFFFF;--card-edge:#CFDDE2;--male:#1F6E9C;--female:#B04A6E;--unknown:#7F8E93;--gold:#138A8A;--gold-soft:#D5EEEC;--danger:#B23A3A;--sheet:#FFFFFF;--shadow:rgba(19,48,58,.14);--band:rgba(19,48,58,.045);--br0:#1F7A8C; --br1:#C2872F; --br2:#6B5AA6; --br3:#C0563F; --br4:#4E8A3A; --br5:#2F5DA8; --br6:#A84C7A; --br7:#2A9D8F;color-scheme:light}
:root[data-skin="gece"]{--paper:#0F1420;--dot:#1E2635;--ink:#E8ECF4;--muted:#98A2B6;--line:#56627A;--card:#182033;--card-edge:#273149;--male:#7FB3E6;--female:#E79AB8;--unknown:#A4ABBA;--gold:#E6B85C;--gold-soft:#3A3220;--danger:#EE8070;--sheet:#141B2B;--shadow:rgba(0,0,0,.5);--band:rgba(255,255,255,.035);--br0:#6FD0C0; --br1:#E6B85C; --br2:#B9A0E6; --br3:#F09A7E; --br4:#A8D46F; --br5:#86AEEA; --br6:#E79AC0; --br7:#7BD69B;color-scheme:dark}
:root[data-skin="col"]{--paper:#F3EDE3;--dot:#DCCFBB;--ink:#3A2A1E;--muted:#7A6553;--line:#B09A82;--card:#FFFBF5;--card-edge:#E4D6C2;--male:#2F6D8C;--female:#A8475C;--unknown:#8C7F6E;--gold:#B5652B;--gold-soft:#F2DCC8;--danger:#A33B2E;--sheet:#FFFBF5;--shadow:rgba(58,42,30,.14);--band:rgba(58,42,30,.045);--br0:#2F7F73; --br1:#B5652B; --br2:#7A4E8C; --br3:#8C5A2B; --br4:#5E7A24; --br5:#3F6390; --br6:#9B4F6B; --br7:#A0832A;color-scheme:light}
:root[data-skin="bahar"]{--paper:#EEF3EA;--dot:#CFDCC8;--ink:#1F2A1D;--muted:#5B6B57;--line:#94A68C;--card:#FFFFFF;--card-edge:#D5E0CF;--male:#2E6E8E;--female:#C0507A;--unknown:#8A927F;--gold:#4C8C3A;--gold-soft:#DDEFD5;--danger:#B03A3A;--sheet:#FFFFFF;--shadow:rgba(31,42,29,.13);--band:rgba(31,42,29,.045);--br0:#3E8E5E; --br1:#C27A2C; --br2:#8456A8; --br3:#C5534A; --br4:#5A8A2A; --br5:#3B6BB0; --br6:#B44C86; --br7:#2F9C8A;color-scheme:light}
:root[data-skin="murekkep"]{--paper:#FFFFFF;--dot:#E2E2E2;--ink:#000000;--muted:#333333;--line:#555555;--card:#FFFFFF;--card-edge:#222222;--male:#0B4F8A;--female:#8A0B4A;--unknown:#444444;--gold:#000000;--gold-soft:#EDEDED;--danger:#A00000;--sheet:#FFFFFF;--shadow:rgba(0,0,0,.18);--band:rgba(0,0,0,.05);--br0:#00695C; --br1:#8D5A00; --br2:#4A2C8A; --br3:#A12A12; --br4:#3B5E00; --br5:#0D3F8C; --br6:#86154E; --br7:#00664A;color-scheme:light}
html,body{height:100%;margin:0}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html[dir=rtl] .cn b,html[dir=rtl] .cn small{text-align:right}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#vp{position:fixed;inset:0;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
#edges rect.band{fill:var(--band)}
#edges .b0{stroke:var(--br0)}#edges .b1{stroke:var(--br1)}#edges .b2{stroke:var(--br2)}#edges .b3{stroke:var(--br3)}#edges .b4{stroke:var(--br4)}#edges .b5{stroke:var(--br5)}#edges .b6{stroke:var(--br6)}#edges .b7{stroke:var(--br7)}
.card.b0{--bc:var(--br0)}.card.b1{--bc:var(--br1)}.card.b2{--bc:var(--br2)}.card.b3{--bc:var(--br3)}.card.b4{--bc:var(--br4)}.card.b5{--bc:var(--br5)}.card.b6{--bc:var(--br6)}.card.b7{--bc:var(--br7)}
.card .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--bc,transparent)}
.card,.wedbtn,.foldbtn{transition:opacity .2s}
#world.focus .card:not(.on),#world.focus .wedbtn:not(.on),#world.focus .foldbtn{opacity:.25}
#world.focus #edges path:not(.on){opacity:.12}
#world.focus #edges path.on{stroke-width:3}
#world.far .cn small{display:none}
#world.far .cn b{font-size:19px;white-space:normal;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#world.vfar .av{display:none}
#world.vfar .cn b{font-size:25px}
.foldbtn{position:absolute;transform:translate(-50%,0);border:1.5px solid var(--card-edge);background:var(--sheet);color:var(--ink);font:600 13px/1 var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px var(--shadow)}
.foldbtn:hover{border-color:var(--gold)}
#gens{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
@media (max-width:700px){.gen span{display:none}.gen{min-width:12px;text-align:center}}
.gen b{font-weight:700}
.gen{position:absolute;inset-inline-start:max(8px,env(safe-area-inset-left,0px));transform:translateY(-50%);font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper);padding:5px 8px;border-radius:999px;border:1px solid var(--card-edge);white-space:nowrap}
#qlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
#sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:230px;overflow:auto}#sugg .lb{margin:2px 0 0}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.qrow small{color:var(--muted);display:block;font-size:12px;margin-top:2px}
#edges .wed{stroke:var(--gold);stroke-width:2.6}
#edges .wed.div{stroke:var(--muted);stroke-dasharray:3 5}
#edges .wed.wid{stroke:var(--muted)}
.yrs{display:grid;grid-template-columns:1fr 1fr 0.8fr;gap:8px;margin-bottom:14px}
.yrs .field{margin:0;min-width:0}
.drow{display:grid;grid-template-columns:0.8fr 1.4fr 1fr;gap:6px}
.drow select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--card-edge);border-radius:12px;padding:10px 8px;min-width:0}
.drow input{min-width:0}
.relbox{background:var(--paper);border-radius:14px;padding:14px;margin-bottom:10px}
.relline{color:var(--muted);font-size:14px;line-height:1.4}
.relline b{color:var(--ink);font-weight:600}
.relword{font-family:var(--f-display);font-size:26px;line-height:1.2;margin-top:4px;text-wrap:balance}
.steps{margin:0 0 12px;padding-inline-start:20px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.legend{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px}
.legend summary{cursor:pointer;font-weight:600}
.legend .lg{display:flex;align-items:center;gap:10px;margin-top:8px;line-height:1.35}
.legend .lg svg{flex:none}
.legend p{margin:10px 0 0;color:var(--muted);line-height:1.45;font-size:13px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.skin{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:14px;border:2px solid var(--card-edge);background:var(--sp);color:var(--si);font:inherit;cursor:pointer;text-align:start}
.skin.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.skin b{font-weight:600;font-size:14px}
.skin .sw{display:flex;gap:4px}.skin .sw i{width:18px;height:6px;border-radius:3px}
.skin .mini{display:flex;align-items:center;width:100%}
.skin .mc{flex:none;width:42px;height:22px;border-radius:7px;background:var(--sc);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.skin .mc em{width:12px;height:12px;border-radius:50%}
.skin .ml{flex:1;height:2.5px;margin:0 3px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cgrid.br{grid-template-columns:repeat(4,1fr)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--card-edge);font-size:14px;cursor:pointer}
.crow input{width:44px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.crow.sm{justify-content:center;gap:6px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chipb{border:1px solid var(--card-edge);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--f-body);cursor:pointer}
.chipb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.agerow{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.agerow .agebox{padding:7px 14px;min-width:40px}
.bday{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.bdl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.agebox{border:1px dashed var(--card-edge);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;color:var(--ink);background:var(--card);min-height:20px;text-align:center}
#edges .inlaw{stroke:var(--muted);stroke-width:1.8;stroke-dasharray:2 6}
.card{position:absolute;width:156px;height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--card);border:1px solid var(--card-edge);border-radius:14px;color:var(--ink);
  font:inherit;text-align:start;cursor:pointer;box-shadow:0 1px 2px var(--shadow)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),0 6px 18px var(--shadow)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:15px;background:var(--unknown)}
.av.m{background:var(--male)} .av.f{background:var(--female)}
.cn{min-width:0;display:flex;flex-direction:column;gap:2px}
.cn b{font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-dot{color:var(--gold)}
.wedbtn{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:2px solid var(--gold);background:var(--card);color:var(--gold);font:700 20px/1 var(--f-body);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 3px var(--shadow)}
.wedbtn:hover{background:var(--gold);color:var(--card)}
.wedbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.chip{position:fixed;z-index:5;background:var(--sheet);border:1px solid var(--card-edge);border-radius:14px;box-shadow:0 2px 10px var(--shadow)}
#brand{top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:max(12px,env(safe-area-inset-left,0px));padding:10px 14px;display:flex;flex-direction:column;gap:2px;max-width:calc(100vw - 170px);box-sizing:border-box}
#brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
#brand span{font-size:12px;color:var(--muted)}
#tools{top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:max(12px,env(safe-area-inset-right,0px));display:flex;padding:4px;gap:2px}
#setbtn{bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer}
#setbtn:focus-visible{outline:2px solid var(--gold)}
#zoom{bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;padding:4px;gap:2px}
#tools button,#zoom button{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:600 20px/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
#tools button:hover,#zoom button:hover{background:var(--paper)}
#tools button:focus-visible,#zoom button:focus-visible{outline:2px solid var(--gold)}
#who{position:relative}
#who .badge{position:absolute;top:2px;inset-inline-end:0;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--ink);color:var(--paper);font:700 10px/16px var(--f-body);text-align:center}
#who .badge.new{background:var(--gold);color:#fff}
#tools .lang{font-size:13px;width:auto;padding:0 10px}
#tools .lock.on{color:var(--gold)}
.err{color:var(--danger);font-size:13px;min-height:16px;margin-top:6px}
.pin{letter-spacing:.3em;text-align:center;font-size:22px!important}

#empty{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#empty .box{pointer-events:auto;max-width:340px;text-align:center;background:var(--sheet);border:1px solid var(--card-edge);border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center}
#empty h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
#empty p{margin:0;color:var(--muted);line-height:1.5;font-size:14.5px}
.seedling{width:56px;height:56px}

.btn{border:1px solid var(--card-edge);background:var(--card);color:var(--ink);font:600 14.5px/1 var(--f-body);padding:12px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}

#sheet{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--sheet);
  border-radius:22px 22px 0 0;border:1px solid var(--card-edge);border-bottom:0;box-shadow:0 -8px 30px var(--shadow);
  padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  max-height:82vh;overflow:auto;transform:translateY(0);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#sheet.off{transform:translateY(110%)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--card-edge);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-head .av{width:46px;height:46px;font-size:19px}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.sh-head .x{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:20px;cursor:pointer}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rel span{font-size:12.5px;background:var(--paper);color:var(--muted);padding:5px 9px;border-radius:999px}
.rel span b{color:var(--ink);font-weight:600}
.lb{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--card-edge);border-radius:12px;padding:11px 12px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.saved{font-size:12px;color:var(--muted);height:16px;margin:4px 0 12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:0;margin-bottom:14px}
.seg{display:flex;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:11px 8px;border-radius:12px;border:1px solid var(--card-edge);cursor:pointer;font-weight:600;font-size:14.5px;background:var(--card)}
.seg input:focus-visible+label{outline:2px solid var(--gold)}
.seg input#g-m:checked+label{background:var(--male);border-color:var(--male);color:#fff}
.seg input#g-f:checked+label{background:var(--female);border-color:var(--female);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:16px}
.hint.ok{color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr;gap:0}
.warn{background:var(--paper);border-radius:12px;padding:12px 14px;line-height:1.45;font-size:14px;margin-bottom:12px}
.ro-note{white-space:pre-wrap;line-height:1.5;background:var(--paper);border-radius:12px;padding:12px;margin-bottom:12px;overflow-wrap:anywhere}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px)}
#brand{cursor:pointer}
#brand-title::after{content:" ▾";font-family:var(--f-body);font-size:13px;color:var(--muted)}
#brand:focus-visible{outline:2px solid var(--gold)}
#onboard{position:fixed;inset:0;z-index:15;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper)}
.obbox{width:100%;max-width:400px;margin-top:6vh;background:var(--sheet);border:1px solid var(--card-edge);border-radius:22px;padding:28px 22px;box-shadow:0 10px 30px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
#ob-body{width:100%;display:flex;flex-direction:column;gap:10px}
#ob-body h2{margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:26px;text-wrap:balance}
#ob-body p{margin:0 0 6px;text-align:center;color:var(--muted);line-height:1.5}
.obf{display:flex;flex-direction:column;gap:6px}
.obf input[type=file]{font-size:14px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--gold-soft);border-radius:12px;line-height:1.4;font-size:14.5px}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--gold)}
.lang-inline{background:transparent;border-color:transparent;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:8px}
.linkbox{width:100%;box-sizing:border-box;min-height:84px;font:13px/1.4 ui-monospace,Menlo,monospace!important;word-break:break-all;margin-bottom:10px}
a.btn{text-decoration:none}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--paper);border-radius:12px}
.mrow>div{flex:1 1 140px;display:flex;flex-direction:column;gap:2px}
.mrow small{color:var(--muted);font-size:12.5px}
.mrow select{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink)}
.btn.sm{min-height:36px;padding:8px 10px;font-size:13.5px}
.pill{font-size:11px;background:var(--gold-soft);color:var(--gold);padding:2px 7px;border-radius:999px;font-weight:600}
.seg.perm label{font-size:13.5px;padding:10px 4px}
.seg.perm input:checked+label{background:var(--ink);border-color:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>

}

function guessGender(full){
  const w=String(full||"").trim().split(/\s+/)[0]; if(!w) return null;
  const n=w.toLocaleLowerCase("tr");
  if(F.has(n)) return "f"; if(M.has(n)) return "m";
  if(/(gül|gul|nisa|xan|guli|خان|گۈل|نىسا|نىسە|خېنىم)$/.test(n)) return "f";
  if(/(ullah|ulla|eddin|ettin|bek|bay|جان|بەگ|ئۇللا|مەت|دىن)$/.test(n)) return "m";
  if(/^abd/.test(n)||/^ئابد/.test(w)) return "m";
  return null;
}

const b64u={enc:u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");},
  dec:s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0));}};
const TE=new TextEncoder(), TD=new TextDecoder();
function seal(obj,key){const n=nacl.randomBytes(24);const box=nacl.secretbox(TE.encode(JSON.stringify(obj)),n,key);const all=new Uint8Array(24+box.length);all.set(n);all.set(box,24);return b64u.enc(all);}
function open_(str,key){const all=b64u.dec(str);const out=nacl.secretbox.open(all.slice(24),all.slice(0,24),key);if(!out)throw new Error("decrypt");return JSON.parse(TD.decode(out));}

function merge(base,local,remote){

}

async function createTree(title,label,people){

  DB.cur=id; saveDB(); S.fitted=false; SYNC="ok"; setPeopleFromCur(); renderStatus(); showOnboarding(false);
  try{await rpc("set_my_label_v2",{p_tree:id,p_token:token,p_label:seal({n:label||"",dev:devName()},key),p_name_hash:nameHash(key,label)});DB.trees[id].devSent=devName();saveDB();}catch(e){}
}
async function joinTree(link,name){
  const p=parseLink(link); if(!p)throw Object.assign(new Error("bad"),{code:"bad"});
  let token=p.token, res2=DB.trees[p.id]&&DB.trees[p.id].token===p.token?"member":"";
  /* davet tek kişilik: ilk açan cihaz kendi anahtarını alır, link bir daha çalışmaz */
  if(!(DB.trees[p.id]&&DB.trees[p.id].token===p.token)){
    const nt=newToken(); let res;
    try{res=await rpc("claim_invite_v2",{p_tree:p.id,p_token:p.token,p_new_token:nt,p_label:seal({n:name||"",dev:devName()},b64u.dec(p.key)),p_name_hash:nameHash(b64u.dec(p.key),name)});}
    catch(e){if(e.code==="no_access")throw Object.assign(new Error("x"),{code:"used"});throw e;}
    if(res==="ok")token=nt; res2=res;
  }
  let rows;
  try{rows=await rpc("get_tree",{p_tree:p.id,p_token:token});}catch(e){if(e.code==="no_access")throw Object.assign(new Error("x"),{code:"used"});throw e;}
  const r=rows&&rows[0]; if(!r)throw Object.assign(new Error("x"),{code:"used"});
  const key=b64u.dec(p.key); const doc=open_(r.blob,key);
  DB.trees[p.id]={id:p.id,named:!!name||res2==="member",token,key:p.key,role:r.role,memberId:r.member_id,title:doc.title||"",people:doc.people||{},base:doc.people||{},log:doc.log||[],myName:name||undefined,version:r.version,dirty:false};
  DB.cur=p.id; saveDB(); S.fitted=false; SYNC="ok"; setPeopleFromCur(); renderStatus(); showOnboarding(false);
}

function restoreBefore(bid){const T=CUR();const log=T.log||[];const i=log.findIndex(e=>e.b===bid);if(i<0)return;

  for(let k=log.length-1;k>=i;k--){const e=log[k];if(e.bf)people[e.id]=JSON.parse(JSON.stringify(e.bf));else delete people[e.id];}
  BATCH=rid();const ids=new Set([...Object.keys(T.people),...Object.keys(people)]);
  ids.forEach(id=>{const cur=T.people[id]||null,nx=people[id]||null;if(JSON.stringify(cur)===JSON.stringify(nx))return;
    if(nx){T.people[id]={...nx,updatedAt:Date.now()};logOp(id,cur,T.people[id],"restore");}else{delete T.people[id];logOp(id,cur,null,"restore");}});
  BATCH=null;touch();}

  es.forEach(e=>{const cur=T.people[e.id]||null;
    if(!e.bf){if(cur){delete T.people[e.id];logOp(e.id,cur,null,bid);}}
    else{T.people[e.id]={...e.bf,updatedAt:Date.now()};logOp(e.id,cur,T.people[e.id],bid);}});

/* ---------- Yaş ---------- */
/* tarih: "1976", "1976-05" ya da "1976-05-14" */
function parseD(v){const m=String(v||"").match(/(\d{4})(?:\D+(\d{1,2}))?(?:\D+(\d{1,2}))?/);if(!m)return null;
  const y=+m[1],mo=m[2]?+m[2]:null,d=m[3]?+m[3]:null;if(y<1)return null;return{y,m:mo>=1&&mo<=12?mo:null,d:mo&&d>=1&&d<=31?d:null};}
function yearOf(v){const d=parseD(v);return d?d.y:null;}
function dateKey(v){const d=parseD(v);return d?d.y*10000+(d.m||0)*100+(d.d||0):99999999;}
function ageOf(p){const b=parseD(p.born);if(!b)return null;const now=new Date();const e=parseD(p.died)||{y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};
  let a=e.y-b.y;if(b.m&&e.m&&(e.m<b.m||(e.m===b.m&&b.d&&e.d&&e.d<b.d)))a--;return a>=0&&a<=125?a:null;}
const MONTHS={tr:["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],
  ug:["يانۋار","فېۋرال","مارت","ئاپرېل","ماي","ئىيۇن","ئىيۇل","ئاۋغۇست","سېنتەبىر","ئۆكتەبىر","نويابىر","دېكابىر"]};
function fmtD(v,short){const d=parseD(v);if(!d)return"";const pad=n=>String(n).padStart(2,"0");
  if(d.m&&d.d)return short?pad(d.d)+"."+pad(d.m)+"."+d.y:d.d+" "+MONTHS[LANG][d.m-1]+" "+d.y;
  if(d.m)return MONTHS[LANG][d.m-1]+" "+d.y;return String(d.y);}
function bdayToday(p){const b=parseD(p.born);if(!b||!b.m||!b.d||p.died)return false;const n=new Date();return n.getMonth()+1===b.m&&n.getDate()===b.d;}
function daysToBday(p){const b=parseD(p.born);if(!b||!b.m||!b.d||parseD(p.died))return null;const n=new Date();n.setHours(0,0,0,0);
  let nx=new Date(n.getFullYear(),b.m-1,b.d);if(nx<n)nx=new Date(n.getFullYear()+1,b.m-1,b.d);return Math.round((nx-n)/864e5);}
function lifeText(p,full){const b=parseD(p.born);if(!b)return "";const d=parseD(p.died);const a=ageOf(p);const cake=bdayToday(p)?"🎂 ":"";
  if(d)return esc(full?fmtD(p.born)+" – "+fmtD(p.died):b.y+"–"+d.y)+(a!=null?" · "+t("ageDied",a):"");
  return cake+esc(full?fmtD(p.born):fmtD(p.born,true))+(a!=null?" · "+t("ageNow",a):"");}

/* ---------- İşlemler ---------- */
const P=id=>id?S.people.get(id):null;
const parentsOf=p=>(p.parents||[]).map(P).filter(Boolean);
/* eşler: p.spouses = [{id, st}] st: "m" evli, "d" boşandı, "w" eşi vefat etti. Eski kayıtlardaki tek "spouse" alanı da okunur. */
function spouseLinks(p){if(!p)return[];const out=[],seen=new Set();
  (p.spouses||[]).forEach(x=>{if(x&&x.id&&x.id!==p.id&&S.people.has(x.id)&&!seen.has(x.id)){seen.add(x.id);out.push({id:x.id,st:x.st||"m"});}});
  if(p.spouse&&p.spouse!==p.id&&S.people.has(p.spouse)&&!seen.has(p.spouse)){seen.add(p.spouse);out.push({id:p.spouse,st:"m"});}
  S.people.forEach(o=>{if(o.id===p.id||seen.has(o.id))return;const l=(o.spouses||[]).find(x=>x&&x.id===p.id);if(l||o.spouse===p.id){seen.add(o.id);out.push({id:o.id,st:(l&&l.st)||"m"});}});
  return out;}
const spousesOf=p=>spouseLinks(p).map(l=>P(l.id)).filter(Boolean);
const spouseOf=p=>{const ls=spouseLinks(p);const cur=ls.filter(l=>l.st==="m");const l=cur[cur.length-1]||ls[ls.length-1];return l?P(l.id):null;};
const marriageSt=(a,b)=>{const l=spouseLinks(a).find(x=>x.id===b);return l?l.st:null;};
async function setMarriage(aId,bId,st){/* st null: bağı kaldır */
  for(const [x,y] of [[aId,bId],[bId,aId]]){const px=P(x);if(!px)continue;let ls=spouseLinks(px).filter(l=>l.id!==y);if(st)ls.push({id:y,st});
    const cur=ls.filter(l=>l.st==="m");await store.update(x,{spouses:ls,spouse:(cur[cur.length-1]||{}).id||""});}}
const kidsOf=p=>[...S.people.values()].filter(c=>(c.parents||[]).includes(p.id));
function newPerson(f){return{name:f.name,gender:f.gender||"",born:f.born||"",died:f.died||"",note:f.note||"",parents:f.parents||[],spouse:f.spouse||"",created:Date.now()};}
async function addChild(pid,f,otherId){const p=P(pid);const o=otherId===undefined?spouseOf(p):P(otherId);const id=uid();await store.set(id,newPerson({...f,parents:[p.id,o&&o.id].filter(Boolean)}));return id;}
async function addSpouse(pid,f){const id=uid();await store.set(id,newPerson({...f}));await setMarriage(pid,id,"m");return id;}
async function addParent(pid,f){const p=P(pid);const other=parentsOf(p)[0];const id=uid();
  await store.set(id,newPerson({...f}));
  if(other&&!spouseLinks(other).length) await setMarriage(other.id,id,"m");
  const sibs=other?kidsOf(other):[p];
  for(const c of sibs){ if((c.parents||[]).length<2) await store.update(c.id,{parents:[...(c.parents||[]),id]}); }
  return id;}
/* Anne-baba önerisi kuralı: kişinin kendisi, kendi soyundan gelenler ve zaten anne-babası olanlar çıkmaz;
   yaşı bilinenlerden sadece 15 yaşından büyük olanlar çıkar (yaşı bilinmeyenler de çıkar);
   anne eklenirken erkekler, baba eklenirken kadınlar çıkmaz. */
function parentCandidates(pid,g){const p=P(pid);if(!p)return[];const ex=new Set([pid,...descendantsOf(p),...(p.parents||[])]);
  return[...S.people.values()].filter(x=>{if(ex.has(x.id))return false;const a=ageOf(x);if(a!=null&&a<=15)return false;if(g&&x.gender&&x.gender!==g)return false;return true;})
    .sort((x,y)=>String(x.name).localeCompare(String(y.name),"tr"));}
/* Var olan kişiyi anne/baba olarak bağla: yeni anne/baba eklemeyle aynı kurallar */
async function linkParent(pid,xid){const p=P(pid),x=P(xid);if(!p||!x)return;const cur=(p.parents||[]).filter(z=>S.people.has(z));if(cur.length>=2||cur.includes(xid))return;
  const other=cur.length?P(cur[0]):null;
  if(other&&!spouseLinks(other).length&&!spouseLinks(x).length) await setMarriage(other.id,xid,"m");
  const sibs=other?kidsOf(other):[p];
  for(const c of sibs){const cp=(c.parents||[]).filter(z=>S.people.has(z));if(cp.length<2&&!cp.includes(xid)&&!descendantsOf(c).has(xid)&&c.id!==xid) await store.update(c.id,{parents:[...cp,xid]});}}
async function removePerson(id){
  for(const c of [...S.people.values()]){
    if((c.parents||[]).includes(id)) await store.update(c.id,{parents:c.parents.filter(x=>x!==id)});
    if(spouseLinks(c).some(l=>l.id===id)){const ls=spouseLinks(c).filter(l=>l.id!==id);const cur=ls.filter(l=>l.st==="m");await store.update(c.id,{spouses:ls,spouse:(cur[cur.length-1]||{}).id||""});}
  }
  await store.remove(id);
}

/* ---------- Yerleşim ---------- */
function computeLayout(){
  const all=[...S.people.values()];
  const rtl=(typeof LANG!=="undefined")&&LANG==="ug";
  const hasPar=p=>(p.parents||[]).some(x=>S.people.has(x));
  /* Ana aile: en önce eklenen atadan kan bağıyla inen herkes */
  const blood=new Set();
  /* ana ata: ilk eklenen kişiden başlayıp anne-babası eklendikçe yukarı tırmanılır (önce baba) */
  let first=[...all].sort((a,b)=>(a.created||0)-(b.created||0))[0];
  for(let guard=0;first&&hasPar(first)&&guard<60;guard++){const ps=parentsOf(first);first=ps.find(x=>x.gender==="m")||ps[0];}
  const rootIds=new Set();
  if(first){const q=[first];rootIds.add(first.id);spousesOf(first).forEach(sp=>{if(!hasPar(sp)){q.push(sp);rootIds.add(sp.id);}});
    while(q.length){const x=q.shift();if(blood.has(x.id))continue;blood.add(x.id);kidsOf(x).forEach(k=>q.push(k));}}
  const score=x=>(blood.has(x.id)?4:0)+(hasPar(x)?2:0);
  const better=(x,y)=>score(x)>score(y)||(score(x)===score(y)&&((x.created||0)<(y.created||0)||((x.created||0)===(y.created||0)&&x.id<y.id)));
  const anchorMemo=new Map();
  const anchorOf=p=>{if(anchorMemo.has(p.id))return anchorMemo.get(p.id);let best=p;spousesOf(p).forEach(x=>{if(better(x,best))best=x;});anchorMemo.set(p.id,best.id);return best.id;};
  const yr=p=>dateKey(p.born);
  const order=(a,b)=>(yr(a)-yr(b))||((a.created||0)-(b.created||0));
  /* dal renkleri: atanın her çocuğu bir dal başlatır, torunlar o rengi taşır */
  const branch=new Map();
  if(first){let origin=new Set(rootIds);
    for(let g=0;g<60;g++){const ks=all.filter(c=>(c.parents||[]).some(x=>origin.has(x)));if(ks.length!==1)break;const k=ks[0];origin=new Set([k.id,...spousesOf(k).map(z=>z.id)]);}
    const top=[...new Set(all.filter(c=>(c.parents||[]).some(x=>origin.has(x))))].sort(order);
    top.forEach((c,i)=>{const b=i%8;const q=[c];while(q.length){const x=q.shift();if(branch.has(x.id))continue;branch.set(x.id,b);kidsOf(x).forEach(k=>q.push(k));}});
    all.forEach(p=>{if(!branch.has(p.id)){const s=spousesOf(p).find(x=>branch.has(x.id)&&blood.has(x.id));if(s)branch.set(p.id,branch.get(s.id));}});}
  const descCount=n=>{const seenD=new Set();const q=[...n];while(q.length){const x=q.shift();kidsOf(x).forEach(k=>{if(!seenD.has(k.id)){seenD.add(k.id);q.push(k);spousesOf(k).forEach(s2=>seenD.add(s2.id));}});}return seenD.size;};
  const seen=new Set();
  function build(aid){
    if(seen.has(aid)) return null; seen.add(aid);
    const a=P(aid);
    const sps=spouseLinks(a).filter(l=>!seen.has(l.id)&&anchorOf(P(l.id))===aid).map(l=>P(l.id));
    sps.forEach(x=>seen.add(x.id));
    let mem;
    if(!sps.length)mem=[a];
    else if(sps.length===1)mem=a.gender==="f"&&sps[0].gender!=="f"?[sps[0],a]:[a,sps[0]];
    else if(sps.length===2)mem=[sps[0],a,sps[1]];
    else mem=[a,...sps];
    const ids=new Set(mem.map(m=>m.id));
    const uw=mem.length*CW+(mem.length-1)*CG;
    let hidden=0, kids=[];
    if(S.collapsed.has(aid)){ hidden=descCount(mem); }
    else kids=all.filter(c=>(c.parents||[]).some(x=>ids.has(x))&&anchorOf(c)===c.id).sort(order).map(c=>{const n=build(c.id);if(n)n.key=(P(c.id).parents||[]).filter(x=>ids.has(x)).sort().join(" ");return n;}).filter(Boolean);
    /* çocuklar hangi evlilikten olduğuna göre gruplanır */
    /* tek ebeveyni girilmiş çocuk: o ebeveynin tek eşi varsa ve o çiftin çocukları varsa, kardeşlerinin arasına doğum sırasıyla girer
       (sadece yerleşim; anne-baba kaydı değişmez) */
    if(mem.length===2){const pk=mem.map(m=>m.id).sort().join(" ");if(kids.some(k=>k.key===pk))kids.forEach(k=>{if(k.key&&!k.key.includes(" "))k.key=pk;});}
    const keyPos=k=>{const ps=k.split(" ");const other=ps.find(x=>x!==aid)||ps[0];return mem.findIndex(m=>m.id===other);};
    const keys=[...new Set(kids.map(k=>k.key))].sort((x,y)=>keyPos(x)-keyPos(y));
    let items=[];
    keys.forEach((key,gi)=>{const gk=kids.filter(k=>k.key===key);
      /* çok çocuklu ailelerde, kendi çocuğu olmayanlar alt alta dizilir */
      let its=gk.map(k=>({t:"n",n:k,w:k.w,g:key}));
      const leaves=gk.filter(k=>!k.kids.length&&!k.hidden);
      if(gk.length>=STACK_MIN&&leaves.length>=2){const fi=gk.indexOf(leaves[0]);const st={t:"s",list:leaves,w:Math.max(...leaves.map(k=>k.uw))+RAIL,g:key};
        its=[];gk.forEach((k,i)=>{if(i===fi)its.push(st);if(!leaves.includes(k))its.push({t:"n",n:k,w:k.w,g:key});});}
      if(gi>0)its[0].gap=SG*2;
      items=items.concat(its);});
    const kw=items.reduce((t2,k)=>t2+k.w+(k.gap||0),0)+Math.max(0,items.length-1)*SG;
    return{mem,anchor:aid,kids,items,keys,uw,kw,w:Math.max(uw,kw),hidden};
  }
  /* katlanmış dalların altındakiler hiç kurulmaz */
  const hiddenIds=new Set();
  S.collapsed.forEach(aid=>{const a=P(aid);if(!a)return;const mem=[a,...spousesOf(a)];const q=[...mem];
    while(q.length){const x=q.shift();kidsOf(x).forEach(k=>{if(!hiddenIds.has(k.id)&&!mem.includes(k)){hiddenIds.add(k.id);q.push(k);spousesOf(k).forEach(s2=>hiddenIds.add(s2.id));}});}});
  hiddenIds.forEach(id=>seen.add(id));
  const roots=[];
  if(first){const n=build(anchorOf(first));n&&roots.push(n);}
  const anchors=[...new Set(all.map(anchorOf))].map(P).sort(order);
  anchors.filter(a=>!hasPar(a)&&!spousesOf(a).some(hasPar)).forEach(a=>{const n=build(a.id);n&&roots.push(n);});
  anchors.forEach(a=>{const n=build(a.id);n&&roots.push(n);});
  all.forEach(p=>{if(!seen.has(p.id)){const n=build(p.id);n&&roots.push(n);}});

  function lay(root){
    const pos=new Map(), edges=[], weds=[], folds=[];
    function place(n,x,d){
      const c=x+n.w/2, st=c-n.uw/2;
      const mem=rtl?[...n.mem].reverse():n.mem;
      const cardX=new Map();mem.forEach((m,i)=>{const cxm=st+i*(CW+CG);cardX.set(m.id,{x:cxm,i});pos.set(m.id,{x:cxm,d});});
      const A=n.anchor, orig=k=>{/* çocuk çizgisinin çıktığı yer */const ps=k.split(" ");const other=ps.find(x=>x!==A);
        if(!ps.includes(A)||!other){const c1=cardX.get(ps[0]);return{px:c1.x+CW/2,mid:false};}
        const a1=cardX.get(A),b1=cardX.get(other);if(Math.abs(a1.i-b1.i)===1)return{px:(Math.max(a1.x,b1.x)-CG/2),mid:true};return{px:b1.x+CW/2,mid:false};};
      n.mem.forEach(m=>{if(m.id===A)return;const a1=cardX.get(A),b1=cardX.get(m.id);const st2=marriageSt(P(A),m.id)||"m";
        if(Math.abs(a1.i-b1.i)===1)weds.push({x1:Math.min(a1.x,b1.x)+CW,x2:Math.max(a1.x,b1.x),d,id:A,sp:m.id,ids:[A,m.id],st:st2});
        else weds.push({bracket:true,xa:a1.x+CW/2,xs:b1.x+CW/2,d,id:A,sp:m.id,ids:[A,m.id],st:st2});});
      if(n.hidden) folds.push({x:c,d,id:n.anchor,n:n.hidden});
      const its=rtl?[...n.items].reverse():n.items;
      let cx=x+(n.w-n.kw)/2; const grp=new Map();
      its.forEach((it,ii)=>{const gp=rtl?(its[ii-1]&&its[ii-1].g!==it.g?SG*2:0):(it.gap||0);cx+=gp;
        if(!grp.has(it.g))grp.set(it.g,{tops:[],stacks:[]});const G=grp.get(it.g);
        if(it.t==="n"){place(it.n,cx,d+1);G.tops.push({x:pos.get(it.n.anchor).x+CW/2,id:it.n.anchor});}
        else{ const railX=rtl?cx+it.w-RAIL/2:cx+RAIL/2, inner=it.w-RAIL, pts=[];
          it.list.forEach((k,i)=>{const dd=d+1+i*STEP;if(k.mem.length>1&&k.mem[0].id!==k.anchor)k.mem=[k.anchor&&P(k.anchor),...k.mem.filter(m=>m.id!==k.anchor)];const ux=rtl?cx+(inner-k.uw):cx+RAIL;place(k,ux,dd);
            k.mem.forEach(m=>stackedIds.add(m.id));pts.push({d:dd,ex:rtl?ux+k.uw:ux,id:k.anchor});});
          G.stacks.push({railX,pts}); }
        cx+=it.w+SG;});
      grp.forEach((G,key)=>{const o=orig(key);edges.push({px:o.px,mid:o.mid,d,tops:G.tops,stacks:G.stacks,pids:key.split(" ")});});
    }
    place(root,0,0); return{pos,edges,weds,folds,w:root.w};
  }
  const stackedIds=new Set();
  const laid=roots.map(r=>({r,...lay(r)}));
  const depth=new Map(); const placed=[]; const absX=new Map();
  const main=laid[0]; if(main){main.off=0;main.x=0;main.pos.forEach((p,id)=>{depth.set(id,p.d);absX.set(id,p.x);});placed.push(main);}
  const FAM=170; let leftX=-FAM, rightX=(main?main.w:0)+FAM;
  const mainMid=main?main.w/2:0;
  let changed=true;
  while(changed){changed=false;
    for(const L2 of laid){ if(placed.includes(L2))continue;
      for(const [id,p] of L2.pos){ const kid=all.find(c=>(c.parents||[]).includes(id)&&!L2.pos.has(c.id)&&depth.has(c.id));
        if(kid){ L2.off=depth.get(kid.id)-1-p.d;
          const kx=absX.get(kid.id)+CW/2;
          if(kx<mainMid){ L2.x=leftX-L2.w; leftX=L2.x-FAM; } else { L2.x=rightX; rightX+=L2.w+FAM; }
          L2.pos.forEach((q,qid)=>{depth.set(qid,q.d+L2.off);absX.set(qid,q.x+L2.x);}); placed.push(L2); changed=true; break; } } } }
  /* çocuğu katlanmış bir dalda kalan dış aileyi gösterme */
  const skip=new Set();
  laid.forEach(L2=>{if(placed.includes(L2))return;
    const linked=[...L2.pos.keys()].some(id=>all.some(c=>(c.parents||[]).includes(id)&&hiddenIds.has(c.id)));
    if(linked)skip.add(L2); else {L2.off=0;L2.x=rightX;rightX+=L2.w+FAM;}});
  const vis=laid.filter(L2=>!skip.has(L2));
  let minD=0,minX=0; vis.forEach(L2=>{minX=Math.min(minX,L2.x);L2.pos.forEach(p=>minD=Math.min(minD,p.d+L2.off));});
  const pos=new Map(), edges=[], weds=[], folds=[];
  vis.forEach(L2=>{ const o=L2.off-minD, Y=d=>(d+o)*ROW, x=L2.x-minX;
    L2.pos.forEach((p,id)=>pos.set(id,{x:p.x+x,y:Y(p.d),row:Number.isInteger(p.d)?p.d+o:null}));
    L2.weds.forEach(r=>weds.push(r.bracket?{bracket:true,xa:r.xa+x,xs:r.xs+x,y:Y(r.d),id:r.id,sp:r.sp,ids:r.ids,st:r.st}:{x1:r.x1+x,x2:r.x2+x,y:Y(r.d)+CH/2,id:r.id,sp:r.sp,ids:r.ids,st:r.st}));
    L2.folds.forEach(f=>folds.push({x:f.x+x,y:Y(f.d)+CH+12,id:f.id,n:f.n}));
    L2.edges.forEach(e=>{const y=Y(e.d);edges.push({px:e.px+x,py:e.mid?y+CH/2:y+CH,by:y+CH+(ROW-CH)/2,tops:e.tops.map(t2=>({x:t2.x+x,id:t2.id})),ty:y+ROW,pids:e.pids,
      stacks:e.stacks.map(sk=>({railX:sk.railX+x,pts:sk.pts.map(q=>({y:Y(q.d)+CH/2,ex:q.ex+x,id:q.id}))}))});}); });
  const links=[];
  all.forEach(c=>{ const cp=pos.get(c.id); if(!cp)return;
    const par=(c.parents||[]).filter(id=>pos.has(id)); if(!par.length)return;
    const drawn=stackedIds.has(c.id)||edges.some(e=>e.tops.some(tp=>tp.id===c.id));
    if(drawn)return;
    const pp=par.map(id=>pos.get(id)); const other=par[1]&&pos.get(par[1]);
    let px=pp[0].x+CW/2, py=pp[0].y+CH;
    if(other&&Math.abs(other.y-pp[0].y)<1){px=(Math.min(pp[0].x,other.x)+CW+Math.max(pp[0].x,other.x))/2;py=pp[0].y+CH/2;}
    links.push({px,py,lane:cp.y-9-((links.length%3)*8),cx:cp.x+CW/2,cy:cp.y,id:c.id,pids:par});
  });
  let W=0,H=0; pos.forEach(p=>{W=Math.max(W,p.x+CW);H=Math.max(H,p.y+CH);});
  /* kuşak satırları: atanın satırı 1. kuşak */
  const rows=new Set(); pos.forEach(p=>{if(p.row!=null)rows.add(p.row);});
  const topRow=rows.size?Math.min(...rows):0;
  const gens=[...rows].sort((a,b)=>a-b).map(r=>({y:r*ROW,n:r-topRow+1}));
  return{pos,edges,weds,links,folds,W,H,gens,branch,blood,first:first&&first.id};
}

const vp=$("vp"), world=$("world"), svg=$("edges");
const T={x:0,y:0,s:1};
function applyT(){world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.s})`;
  world.classList.toggle("far",T.s<.55);world.classList.toggle("vfar",T.s<.3);placeGens();
  vp.style.backgroundSize=`${24*T.s}px ${24*T.s}px`;vp.style.backgroundPosition=`${T.x}px ${T.y}px`;}
function placeGens(){const g=$("gens");if(!g||!L.gens)return;
  const tight=ROW*T.s<44;const els=g.children;L.gens.forEach((r,i)=>{const el=els[i];if(!el)return;const y=T.y+(r.y+CH/2)*T.s;el.style.top=y+"px";el.hidden=tight||r.n<1||y<70||y>innerHeight-20;});}
function zoomAt(f,cx,cy){const ns=Math.min(2.5,Math.max(.15,T.s*f));const k=ns/T.s;T.x=cx-(cx-T.x)*k;T.y=cy-(cy-T.y)*k;T.s=ns;applyT();}
let L={W:0,H:0};
function fit(){const vw=innerWidth,vh=innerHeight;const top=90,bot=40;
  if(!L.W){T.s=1;T.x=vw/2;T.y=vh/2;applyT();return;}
  const s=Math.min(1.1,Math.max(.12,Math.min((vw-140)/L.W,(vh-top-bot)/L.H)));
  T.s=s;T.x=50+(vw-50-L.W*s)/2;T.y=top+Math.max(0,(vh-top-bot-L.H*s)/2);applyT();}
function startView(){const p=L.first&&L.pos.get(L.first);
  if(innerWidth<700&&p&&L.W*.5>innerWidth){T.s=.6;T.x=innerWidth/2-(p.x+CW+CG/2)*T.s;T.y=120-p.y*T.s;applyT();}else fit();}
function centerOn(id){const p=L.pos&&L.pos.get(id);if(!p)return;const vw=innerWidth,vh=innerHeight;
  const sheetH=$("sheet").classList.contains("off")?0:Math.min($("sheet").offsetHeight,vh*.6);
  const tx=vw/2-(p.x+CW/2)*T.s, ty=(vh-sheetH)/2-(p.y+CH/2)*T.s;
  const sx=T.x,sy=T.y,t0=performance.now(),dur=matchMedia("(prefers-reduced-motion:reduce)").matches?0:260;
  (function step(tm){const k=dur?Math.min(1,(tm-t0)/dur):1,e=1-Math.pow(1-k,3);T.x=sx+(tx-sx)*e;T.y=sy+(ty-sy)*e;applyT();if(k<1)requestAnimationFrame(step);})(t0);}

const ptrs=new Map(); let gest=null;
vp.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){gest={sx:e.clientX,sy:e.clientY,tx:T.x,ty:T.y,moved:false,target:e.target.closest(".card,.wedbtn,.foldbtn")};}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y),s:T.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:T.x,ty:T.y,moved:true};}
});
addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gest)return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=Math.min(2.5,Math.max(.15,gest.s*d/gest.d)),k=ns/gest.s;
    T.s=ns;T.x=mx-(gest.mx-gest.tx)*k;T.y=my-(gest.my-gest.ty)*k;applyT();}
  else if(!gest.pinch){const dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;
    if(!gest.moved&&Math.hypot(dx,dy)>6){gest.moved=true;vp.classList.add("drag");}
    if(gest.moved){T.x=gest.tx+dx;T.y=gest.ty+dy;applyT();}}
});
function up(e){ if(!ptrs.has(e.pointerId))return; ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gest){ if(!gest.moved){ if(gest.target){ if(gest.target.classList.contains("foldbtn")){toggleFold(gest.target.dataset.id,false);}else if(gest.target.classList.contains("wedbtn")){ if(S.canWrite){S.sel=null;action("child",gest.target.dataset.id,gest.target.dataset.sp);} } else select(gest.target.dataset.id);} else closeSheet(); } gest=null; vp.classList.remove("drag"); }
  else if(ptrs.size===1){const [a]=[...ptrs.values()];gest={sx:a.x,sy:a.y,tx:T.x,ty:T.y,moved:true};}}
addEventListener("pointerup",up); addEventListener("pointercancel",up);
vp.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY);},{passive:false});

function initial(n){const s=String(n||"?").trim();return s?Array.from(s)[0].toLocaleUpperCase("tr"):"?";}
function render(){
  const n=S.people.size;
  renderStatus();
  $("empty").hidden=!S.ready||n>0;
  $("first-add").hidden=!S.canWrite;
  document.querySelector("#empty p").textContent=S.canWrite?t("emptyText"):t("emptyLocked");
  L=computeLayout();
  world.querySelectorAll(".card").forEach(c=>{if(!S.people.has(c.dataset.id))c.remove();});
  for(const p of S.people.values()){
    let el=world.querySelector(`.card[data-id="${CSS.escape(p.id)}"]`);
    if(!el){el=document.createElement("button");el.className="card";el.dataset.id=p.id;el.innerHTML='<span class="av"></span><span class="cn"><b dir="auto"></b><small></small></span>';world.appendChild(el);}
    const ps=L.pos.get(p.id); el.hidden=!ps; if(!ps)continue;
    el.style.left=ps.x+"px";el.style.top=ps.y+"px";

async function mergePeople(keepId,dropId){const a=P(keepId),b=P(dropId);if(!a||!b||a.id===b.id)return;BATCH=rid();
  const patch={};["name","gender","born","died"].forEach(k=>{if(!a[k]&&b[k])patch[k]=b[k];});
  if(b.note&&b.note!==a.note)patch.note=a.note?a.note+"\n"+b.note:b.note;
  const par=[...new Set([...(a.parents||[]),...(b.parents||[])])].filter(x=>S.people.has(x)&&x!==a.id&&x!==b.id).slice(0,2);patch.parents=par;
  const sl=[...spouseLinks(a),...spouseLinks(b)].filter(l=>l.id!==a.id&&l.id!==b.id);const seenS=new Map();sl.forEach(l=>{if(!seenS.has(l.id))seenS.set(l.id,l);});
  const spl=[...seenS.values()];const cur=spl.filter(l=>l.st==="m");patch.spouses=spl;patch.spouse=(cur[cur.length-1]||{}).id||"";
  await store.update(a.id,patch);
  for(const o of [...S.people.values()]){if(o.id===a.id||o.id===b.id)continue;const up={};
    if((o.parents||[]).includes(b.id))up.parents=[...new Set((o.parents||[]).map(x=>x===b.id?a.id:x))].slice(0,2);
    const ol=spouseLinks(o);if(ol.some(l=>l.id===b.id)){const m=new Map();ol.forEach(l=>{const id2=l.id===b.id?a.id:l.id;if(!m.has(id2))m.set(id2,{id:id2,st:l.st});});const arr=[...m.values()];const c2=arr.filter(l=>l.st==="m");up.spouses=arr;up.spouse=(c2[c2.length-1]||{}).id||"";}
    if(Object.keys(up).length)await store.update(o.id,up);}
  await store.remove(b.id);BATCH=null;}
/* Kopya kayıt kuralı (sadece bunlar birlikte sağlanırsa "aynı kişi olabilir" denir):
   1) isim aynı (büyük/küçük harf ve boşluk fark etmez)
   2) cinsiyet aynı ya da birinde boş
   3) doğum tarihi aynı ya da birinde boş (ikisi de dolu ve farklıysa farklı kişidir)
   4) vefat tarihi aynı ya da birinde boş
   5) anne-babası aynı ya da birinde hiç girilmemiş (ikisinde de var ve farklıysa farklı kişidir)
   Sadece isim aynı olan farklı kişiler (ör. dedesinin adını taşıyan torun) kopya sayılmaz. */
function sameInfo(a,b){if(normName(a.name)!==normName(b.name)||!normName(a.name))return false;
  if(a.gender&&b.gender&&a.gender!==b.gender)return false;
  const ka=dateKey(a.born),kb=dateKey(b.born);if(a.born&&b.born&&ka!==kb)return false;
  const da=dateKey(a.died),db=dateKey(b.died);if(a.died&&b.died&&da!==db)return false;
  const pa=(a.parents||[]).filter(x=>S.people.has(x)).sort(),pb=(b.parents||[]).filter(x=>S.people.has(x)).sort();
  if(pa.length&&pb.length&&pa.join()!==pb.join())return false;
  return true;}
function dupGroups(){const list=[...S.people.values()],used=new Set(),out=[];
  list.forEach(a=>{if(used.has(a.id))return;const g=[a];list.forEach(b=>{if(b.id!==a.id&&!used.has(b.id)&&g.every(x=>sameInfo(x,b)))g.push(b);});
    if(g.length>1){g.forEach(x=>used.add(x.id));g.sort((x,y)=>(parentsOf(y).length+kidsOf(y).length+spousesOf(y).length)-(parentsOf(x).length+kidsOf(x).length+spousesOf(x).length));out.push(g);}});
  return out;}

function drawTree(){
  const PAD=60, HEAD=110, T=CUR();
  const scale=Math.min(2,Math.max(1,7000/(L.W+PAD*2)));
  const W=L.W+PAD*2, H=L.H+PAD*2+HEAD;
  const cv=document.createElement("canvas");cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);
  const c=cv.getContext("2d");c.scale(scale,scale);
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  const col={bg:v("--paper"),band:v("--band"),line:v("--line"),gold:v("--gold"),muted:v("--muted"),ink:v("--ink"),card:v("--card"),edge:v("--card-edge"),m:v("--male"),f:v("--female"),u:v("--unknown"),
    br:[0,1,2,3,4,5,6,7].map(i=>v("--br"+i))};
  const font=(w,sz)=>`${w} ${sz}px Figtree, "Noto Sans Arabic", system-ui, sans-serif`;
  c.fillStyle=col.bg;c.fillRect(0,0,W,H);
  c.fillStyle=col.ink;c.font=`400 34px "Young Serif", Georgia, serif`;c.textBaseline="alphabetic";
  c.direction=LANG==="ug"?"rtl":"ltr";c.textAlign=LANG==="ug"?"right":"left";
  const hx=LANG==="ug"?W-PAD:PAD;
  c.fillText(T&&T.title||t("title"),hx,PAD+20);
  c.font=font(500,15);c.fillStyle=col.muted;c.fillText(t("people",S.people.size)+" · "+new Date().toLocaleDateString(LANG==="ug"?"ug":"tr"),hx,PAD+48);
  c.save();c.translate(PAD,PAD+HEAD);
  /* kuşak şeritleri */
  L.gens.forEach((g,i)=>{if(i%2)return;c.fillStyle=col.band;c.fillRect(-PAD,g.y-20,W,CH+40);});
  c.direction="ltr";c.textAlign="left";c.font=font(700,12);c.fillStyle=col.muted;
  c.direction=LANG==="ug"?"rtl":"ltr";L.gens.forEach(g=>{if(g.n>=1)c.fillText(g.n+t("genWord"),LANG==="ug"?-PAD+70:-PAD+12,g.y+CH/2+4);});c.direction="ltr";
  /* çizgiler: ekrandaki svg yollarını aynen kullan */
  svg.querySelectorAll("path").forEach(pth=>{const cl=pth.getAttribute("class")||"";const d=pth.getAttribute("d");if(!d)return;
    const b=(cl.match(/\bb(\d)\b/)||[])[1];
    c.strokeStyle=cl.includes("wed")?(cl.includes("div")||cl.includes("wid")?col.muted:col.gold):cl.includes("inlaw")?col.muted:(b!=null?col.br[+b]:col.line);
    c.lineWidth=cl.includes("wed")?2.6:2;c.lineCap="round";c.lineJoin="round";
    c.setLineDash(cl.includes("inlaw")?[2,6]:cl.includes("div")?[3,5]:[]);c.stroke(new Path2D(d));});
  c.setLineDash([]);
  /* kartlar */
  const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
  S.people.forEach(p=>{const ps=L.pos.get(p.id);if(!ps)return;
    c.shadowColor="rgba(30,39,36,.10)";c.shadowBlur=4;c.shadowOffsetY=1;rr(ps.x,ps.y,CW,CH,14);c.fillStyle=col.card;c.fill();
    c.shadowColor="transparent";c.strokeStyle=col.edge;c.lineWidth=1;c.stroke();
    const rtl=LANG==="ug", ax=rtl?ps.x+CW-12-17:ps.x+12+17, ay=ps.y+CH/2;
    const b=L.branch.get(p.id);if(b!=null){c.beginPath();c.arc(ax,ay,21,0,7);c.fillStyle=col.br[b];c.fill();c.beginPath();c.arc(ax,ay,19,0,7);c.fillStyle=col.card;c.fill();}
    c.beginPath();c.arc(ax,ay,17,0,7);c.fillStyle=p.gender==="m"?col.m:p.gender==="f"?col.f:col.u;c.fill();
    c.fillStyle="#fff";c.font=font(700,15);c.textAlign="center";c.direction="ltr";c.fillText(initial(p.name),ax,ay+5);
    const maxW=CW-12-34-10-10, nx=rtl?ps.x+CW-12-34-10:ps.x+12+34+10;
    c.direction=rtl?"rtl":"ltr";c.textAlign="start";c.fillStyle=col.ink;c.font=font(600,14);
    let name=p.name||t("unnamed");while(c.measureText(name).width>maxW&&name.length>2)name=name.slice(0,-2)+"…";
    c.fillText(name,nx,ps.y+CH/2-2);
    const sub=[lifeText(p).replace(/<[^>]+>/g,""),kidsOf(p).length?t("nKids",kidsOf(p).length):""].filter(Boolean).join(" · ");
    c.font=font(400,11.5);c.fillStyle=col.muted;let sb=sub;while(c.measureText(sb).width>maxW&&sb.length>2)sb=sb.slice(0,-2)+"…";c.fillText(sb,nx,ps.y+CH/2+15);
  });
  c.restore();
  return cv;
}

const hex2rgb=h=>{h=String(h).trim();if(h.startsWith("rgb")){const m=h.match(/[\d.]+/g).map(Number);return m.slice(0,3);}h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];};
const rgb2hex=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix=(a,b,t2)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v*t2+y[i]*(1-t2)));};
const lum=h=>{const [r,g,b]=hex2rgb(h);return(0.2126*r+0.7152*g+0.0722*b)/255;};
function customVars(c){const o={...c};const dark=lum(c["--paper"])<.45;const [r,g,b]=hex2rgb(c["--ink"]);

function relChips(p){
  const par=parentsOf(p),s=spouseOf(p),k=kidsOf(p);
  const chip=(l,v)=>`<span>${l}: <b dir="auto">${esc(v)}</b></span>`;
  const out=[];
  const f=par.find(x=>x.gender==="m"),m=par.find(x=>x.gender==="f");
  if(f)out.push(chip(t("father"),f.name)); if(m)out.push(chip(t("mother"),m.name));
  par.filter(x=>x!==f&&x!==m).forEach(x=>out.push(chip(t("parent"),x.name)));
  spouseLinks(p).forEach(l=>{const x=P(l.id);out.push(chip(l.st==="d"?t("exSpouse"):l.st==="w"?t("lateSpouse"):t("spouse"),x.name));});
  /* üvey anne/baba: anne ya da babanın, kendi anne-babası olmayan eşleri */
  const parIds=new Set(par.map(x=>x.id));
  const steps=stepParentsOf(p);
  steps.forEach(x=>out.push(chip(x.gender==="f"?t("stepMother"):x.gender==="m"?t("stepFather"):t("stepParent"),x.name)));
  const sib=[...new Map(par.flatMap(x=>kidsOf(x)).filter(x=>x.id!==p.id).map(x=>[x.id,x])).values()];
  const half=sib.filter(x=>isHalfSib(p,x)), full=sib.filter(x=>!half.includes(x));
  if(full.length)out.push(chip(t("siblings"),t("people",full.length)));
  if(half.length)out.push(chip(t("halfSiblings"),t("people",half.length)));
  if(k.length)out.push(chip(t("kids"),t("people",k.length)));
  return out.length?`<div class="rel">${out.join("")}</div>`:"";
}

  if(a==="child"){const sps=spousesOf(p);
    if(other===undefined&&sps.length>1){sheetMode="menu";
      openSheet(`<div class="sh-head"><div><h2>${esc(t("tChild"))}</h2><div style="color:var(--muted);font-size:13px">${esc(t("whichParent"))}</div></div><button class="x" id="sh-x">×</button></div>
       <div class="menu">${sps.map(x=>`<button class="btn" data-op="${esc(x.id)}" dir="auto">${esc(t("childOf",p.name,x.name))}</button>`).join("")}
       <button class="btn" data-op="">${esc(t("otherParentUnknown"))}</button><button class="btn" id="op-back">${esc(t("back"))}</button></div>`);
      sheet.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>action("child",id,b.dataset.op));$("op-back").onclick=back;return;}
    const o=other===undefined?spouseOf(p):(other?P(other):null);
    formView(t("tChild"),t("childOf",p.name,o&&o.name),{withNote:true,back,parentsHint:[p.id,o&&o.id].filter(Boolean)},f=>addChild(id,f,o?o.id:null));}
  if(a==="rel"){showRelPick(id);return;}
  if(a==="links"){showLinks(id);return;}
  if(a==="addpar"){const x=P(other);if(!x)return;const par=(p.parents||[]).filter(z=>S.people.has(z));if(par.length!==1)return;
    store.update(id,{parents:[par[0],x.id]});toast(t("saved"));setTimeout(()=>select(id),50);return;}
  if(a==="marr"){sheetMode="menu";
    openSheet(`<div class="sh-head"><div><h2>${esc(t("marriages"))}</h2><div style="color:var(--muted);font-size:13px" dir="auto">${esc(p.name)}</div></div><button class="x" id="sh-x">×</button></div>
     <div class="mlist">${spouseLinks(p).map(l=>{const x=P(l.id);return`<div class="mrow"><div style="min-width:0"><b dir="auto">${esc(x.name)}</b></div>
       <select data-ms="${esc(x.id)}" aria-label="${esc(t("marriages"))}"><option value="m"${l.st==="m"?" selected":""}>${esc(t("stMarried"))}</option><option value="d"${l.st==="d"?" selected":""}>${esc(t("stDivorced"))}</option><option value="w"${l.st==="w"?" selected":""}>${esc(t("stWidowed"))}</option><option value="x">${esc(t("stRemove"))}</option></select></div>`;}).join("")}</div>
     <p style="color:var(--muted);font-size:13px;line-height:1.5">${esc(t("marrNote"))}</p>
     <button class="btn" id="ms-back" style="width:100%">${esc(t("back"))}</button>`);
    sheet.querySelectorAll("[data-ms]").forEach(sel=>sel.onchange=async()=>{await setMarriage(id,sel.dataset.ms,sel.value==="x"?null:sel.value);toast(t("saved"));action("marr",id);});
    $("ms-back").onclick=back;return;}
  if(a==="spouse"){const g=p.gender==="m"?"f":p.gender==="f"?"m":"";formView(t("tSpouse"),t("forX",p.name),{withNote:true,gender:g,genderHint:g?t("hOpp"):"",back},f=>addSpouse(id,f));}
  if(a==="parent"){const o=parentsOf(p)[0];const g=o?(o.gender==="m"?"f":o.gender==="f"?"m":""):"";
    formView(g==="f"?t("addMother"):g==="m"?t("addFather"):t("addParents"),o?t("pairWith",p.name,o.name):t("forX",p.name),{withNote:true,gender:g,back,
      suggest:()=>parentCandidates(id,g),
      onPick:async x=>{await linkParent(id,x.id);toast(t("saved"));closeSheet();setTimeout(()=>select(id),50);}},f=>addParent(id,f));}
  if(a==="edit"){formView(t("tEdit"),"",{editId:id,name:p.name,gender:p.gender,born:p.born,died:p.died,back},async f=>{await store.update(id,{name:f.name,gender:f.gender,born:f.born,died:f.died});return id;});}
  if(a==="fold"){toggleFold(id);return;}
  if(a==="del"){sheetMode="confirm";const k=kidsOf(p).length;
    openSheet(`<div class="sh-head"><h2>${t("tDel")}</h2><button class="x" id="sh-x">×</button></div>
      <div class="warn">${t("delText",esc(p.name),k)}</div>
      <div class="acts"><button class="btn" id="d-no">${t("cancel")}</button><button class="btn danger solid" id="d-yes">${t("yesDel")}</button></div>`);
    $("d-no").onclick=back;
    $("d-yes").onclick=async()=>{$("d-yes").disabled=true;try{await removePerson(id);closeSheet();toast(t("deleted"));}catch(e){$("d-yes").disabled=false;}};}
}
$("first-add").onclick=()=>formView(t("tFirst"),t("firstSub"),{withNote:true},async f=>{const id=uid();await store.set(id,newPerson(f));S.fitted=false;return id;});

let tt;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}
addEventListener("resize",()=>{if(!S.people.size)fit();});
applySkin(curSkin()); applyLang(); applyT(); render(); bootData();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
